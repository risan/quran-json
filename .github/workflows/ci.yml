name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --locked

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: install the isolated site dependencies
        run: npm ci --prefix site

      - name: lint the site
        run: npm run lint --prefix site

      - name: check site formatting
        run: npm run fmt:check --prefix site

      - name: type-check the Astro site
        run: npm run check --prefix site

      - name: test the reader logic
        run: npm test --prefix site

      - name: build the assembled site
        run: npm run site -- --no-cdn

      - name: check the assembled site
        run: uv run pytest tests/test_site_build.py

      - name: snapshots and licences are intact
        run: uv run quran-json verify

      - run: uv run pytest

      - run: uv run ruff check .

      - run: uv run ruff format --check .

      - run: uv run mypy

      # The site is deliberately unversioned: `DATASET_VERSION` is a constant and no
      # published path carries a version segment, so this only smoke-tests the render.
      - name: build the CDN site
        run: uv run quran-json cdn
